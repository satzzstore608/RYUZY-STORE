<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>R-Gaming | Top Up Games Terpercaya</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        body { 
            font-family: 'Poppins', sans-serif; 
            background-color: #0b0f19; 
            color: #e2e8f0; 
        }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #4f46e5; border-radius: 10px; }

        /* Logo Glow Effect */
        .logo-glow {
            filter: drop-shadow(0 0 10px rgba(99, 102, 241, 0.5));
            transition: filter 0.3s ease;
        }
        .logo-glow:hover {
            filter: drop-shadow(0 0 20px rgba(168, 85, 247, 0.8));
        }

        /* Modal Animation */
        .modal-enter { animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes slideUp {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        /* Card Hover Effects */
        .service-card { 
            background: linear-gradient(145deg, #1e293b, #0f172a);
            border: 1px solid #334155;
            transition: all 0.3s ease; 
        }
        .service-card:hover { 
            transform: translateY(-4px); 
            border-color: #818cf8; 
            box-shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.2); 
        }

        .product-card {
            background: #1e293b;
            border: 1px solid #334155;
            transition: all 0.2s ease;
        }
        .product-card.active { 
            border-color: #6366f1; 
            background: rgba(99, 102, 241, 0.1); 
            box-shadow: 0 0 15px rgba(99, 102, 241, 0.15);
        }
        .product-card:hover { border-color: #6366f1; }
    </style>
</head>
<body class="pb-24 min-h-screen">

    <!-- HEADER / NAVBAR -->
    <nav class="bg-[#0b0f19]/90 backdrop-blur-md border-b border-slate-800 sticky top-0 z-40 px-4 py-3 flex items-center justify-between">
        <!-- LOGO DI KIRI ATAS -->
        <div class="flex items-center gap-3">
            <!-- Ganti src dengan path file logo R Anda -->
            <img src="https://i.imgur.com/placeholder-R-logo.png" alt="R Gaming Logo" class="w-10 h-10 object-contain logo-glow">
            <span class="font-bold text-xl tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 to-purple-400" style="font-family: 'Orbitron', sans-serif;">
                R-GAMING
            </span>
        </div>
        
        <div class="flex items-center gap-4">
            <button class="text-slate-400 hover:text-white transition-colors"><i class="fa-solid fa-magnifying-glass text-lg"></i></button>
            <button class="text-yellow-500 hover:text-yellow-400 relative">
                <i class="fa-solid fa-crown text-lg"></i>
            </button>
            <button class="w-9 h-9 bg-slate-800 rounded-full flex items-center justify-center text-indigo-400 border border-slate-700 hover:border-indigo-500 transition-colors">
                <i class="fa-regular fa-user"></i>
            </button>
            <button class="text-slate-400 lg:hidden"><i class="fa-solid fa-bars text-lg"></i></button>
        </div>
    </nav>

    <!-- MAIN CONTENT -->
    <main class="max-w-5xl mx-auto p-4 space-y-8">

        <!-- BANNER PROMO -->
        <div class="w-full h-40 md:h-56 rounded-2xl flex items-center justify-center text-white shadow-2xl overflow-hidden relative border border-slate-700">
            <div class="absolute inset-0 bg-gradient-to-br from-indigo-900 via-purple-900 to-slate-900"></div>
            <div class="absolute inset-0 opacity-30 bg-[url('https://www.transparenttextures.com/patterns/carbon-fibre.png')]"></div>
            <div class="text-center z-10 px-4">
                <h2 class="text-3xl md:text-4xl font-bold mb-2 text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-purple-400" style="font-family: 'Orbitron', sans-serif;">LEVEL UP YOUR GAME</h2>
                <p class="text-sm md:text-base text-slate-300">Top up instant, aman, dan terpercaya 24/7</p>
            </div>
        </div>

        <!-- KATEGORI LAYANAN UTAMA -->
        <section>
            <h3 class="text-lg font-bold text-white mb-4 flex items-center gap-2 border-l-4 border-indigo-500 pl-3">
                POPULAR GAMES
            </h3>
            
            <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4">
                <!-- Mobile Legends -->
                <button onclick="openServiceModal('mlbb')" class="service-card p-5 rounded-xl flex flex-col items-center text-center gap-3 cursor-pointer group">
                    <div class="w-14 h-14 rounded-full bg-blue-500/10 flex items-center justify-center group-hover:bg-blue-500/20 transition-colors">
                        <i class="fa-solid fa-shield-cat text-2xl text-blue-500"></i>
                    </div>
                    <div>
                        <h3 class="font-bold text-sm text-slate-200">Mobile Legends</h3>
                        <p class="text-[10px] text-slate-500">Diamonds</p>
                    </div>
                </button>
                
                <!-- Free Fire -->
                <button onclick="openServiceModal('freefire')" class="service-card p-5 rounded-xl flex flex-col items-center text-center gap-3 cursor-pointer group">
                    <div class="w-14 h-14 rounded-full bg-orange-500/10 flex items-center justify-center group-hover:bg-orange-500/20 transition-colors">
                        <i class="fa-solid fa-fire text-2xl text-orange-500"></i>
                    </div>
                    <div>
                        <h3 class="font-bold text-sm text-slate-200">Free Fire</h3>
                        <p class="text-[10px] text-slate-500">Diamonds</p>
                    </div>
                </button>

                <!-- PUBG -->
                <button onclick="openServiceModal('pubg')" class="service-card p-5 rounded-xl flex flex-col items-center text-center gap-3 cursor-pointer group">
                    <div class="w-14 h-14 rounded-full bg-yellow-500/10 flex items-center justify-center group-hover:bg-yellow-500/20 transition-colors">
                        <i class="fa-solid fa-crosshairs text-2xl text-yellow-500"></i>
                    </div>
                    <div>
                        <h3 class="font-bold text-sm text-slate-200">PUBG Mobile</h3>
                        <p class="text-[10px] text-slate-500">UC</p>
                    </div>
                </button>

                <!-- Genshin Impact -->
                <button onclick="openServiceModal('genshin')" class="service-card p-5 rounded-xl flex flex-col items-center text-center gap-3 cursor-pointer group">
                    <div class="w-14 h-14 rounded-full bg-purple-500/10 flex items-center justify-center group-hover:bg-purple-500/20 transition-colors">
                        <i class="fa-solid fa-star text-2xl text-purple-500"></i>
                    </div>
                    <div>
                        <h3 class="font-bold text-sm text-slate-200">Genshin Impact</h3>
                        <p class="text-[10px] text-slate-500">Genesis Crystals</p>
                    </div>
                </button>

                <!-- Valorant -->
                <button onclick="openServiceModal('valorant')" class="service-card p-5 rounded-xl flex flex-col items-center text-center gap-3 cursor-pointer group">
                    <div class="w-14 h-14 rounded-full bg-red-500/10 flex items-center justify-center group-hover:bg-red-500/20 transition-colors">
                        <i class="fa-solid fa-v text-2xl text-red-500"></i>
                    </div>
                    <div>
                        <h3 class="font-bold text-sm text-slate-200">Valorant</h3>
                        <p class="text-[10px] text-slate-500">VP Points</p>
                    </div>
                </button>

                <!-- Roblox -->
                <button onclick="openServiceModal('roblox')" class="service-card p-5 rounded-xl flex flex-col items-center text-center gap-3 cursor-pointer group">
                    <div class="w-14 h-14 rounded-full bg-gray-500/10 flex items-center justify-center group-hover:bg-gray-500/20 transition-colors">
                        <i class="fa-solid fa-cube text-2xl text-gray-400"></i>
                    </div>
                    <div>
                        <h3 class="font-bold text-sm text-slate-200">Roblox</h3>
                        <p class="text-[10px] text-slate-500">Robux</p>
                    </div>
                </button>

                <!-- Honor of Kings -->
                <button onclick="openServiceModal('hok')" class="service-card p-5 rounded-xl flex flex-col items-center text-center gap-3 cursor-pointer group">
                    <div class="w-14 h-14 rounded-full bg-indigo-500/10 flex items-center justify-center group-hover:bg-indigo-500/20 transition-colors">
                        <i class="fa-solid fa-chess-knight text-2xl text-indigo-500"></i>
                    </div>
                    <div>
                        <h3 class="font-bold text-sm text-slate-200">Honor of Kings</h3>
                        <p class="text-[10px] text-slate-500">Tokens</p>
                    </div>
                </button>

                <!-- TikTok SMM -->
                <button onclick="openServiceModal('tiktok')" class="service-card p-5 rounded-xl flex flex-col items-center text-center gap-3 cursor-pointer group">
                    <div class="w-14 h-14 rounded-full bg-pink-500/10 flex items-center justify-center group-hover:bg-pink-500/20 transition-colors">
                        <i class="fa-brands fa-tiktok text-2xl text-pink-500"></i>
                    </div>
                    <div>
                        <h3 class="font-bold text-sm text-slate-200">TikTok</h3>
                        <p class="text-[10px] text-slate-500">Services</p>
                    </div>
                </button>
            </div>
        </section>

        <!-- AREA FORM TOP UP -->
        <section id="topup-section" class="hidden space-y-6 animate-fade-in">
            <div class="flex items-center justify-between border-b border-slate-800 pb-2">
                <h3 id="selected-game-title" class="text-xl font-bold text-indigo-400 uppercase" style="font-family: 'Orbitron', sans-serif;">TOP UP</h3>
                <button onclick="resetSelection()" class="text-xs text-slate-500 hover:text-red-400 transition-colors flex items-center gap-1">
                    <i class="fa-solid fa-arrow-left"></i> Kembali
                </button>
            </div>

            <!-- Input Data Akun -->
            <div class="bg-slate-800/50 p-5 rounded-xl border border-slate-700">
                <h4 class="font-semibold text-slate-200 mb-4 flex items-center gap-3">
                    <span class="w-7 h-7 bg-indigo-600 text-white rounded-lg flex items-center justify-center text-xs font-bold shadow-lg shadow-indigo-500/30">1</span>
                    Masukkan Data Akun
                </h4>
                <div class="grid grid-cols-2 gap-3">
                    <input type="number" placeholder="User ID" class="w-full p-3 bg-slate-900 border border-slate-700 rounded-lg focus:outline-none focus:border-indigo-500 text-sm text-white placeholder-slate-600 transition-colors">
                    <input type="number" placeholder="Zone ID (Optional)" class="w-full p-3 bg-slate-900 border border-slate-700 rounded-lg focus:outline-none focus:border-indigo-500 text-sm text-white placeholder-slate-600 transition-colors">
                </div>
            </div>

            <!-- Pilih Nominal -->
            <div class="bg-slate-800/50 p-5 rounded-xl border border-slate-700">
                <h4 class="font-semibold text-slate-200 mb-4 flex items-center gap-3">
                    <span class="w-7 h-7 bg-indigo-600 text-white rounded-lg flex items-center justify-center text-xs font-bold shadow-lg shadow-indigo-500/30">2</span>
                    Pilih Nominal Top Up
                </h4>
                
                <div id="product-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3">
                    <!-- Produk di-render JS -->
                </div>
            </div>

            <!-- Metode Pembayaran -->
            <div class="bg-slate-800/50 p-5 rounded-xl border border-slate-700">
                <h4 class="font-semibold text-slate-200 mb-4 flex items-center gap-3">
                    <span class="w-7 h-7 bg-indigo-600 text-white rounded-lg flex items-center justify-center text-xs font-bold shadow-lg shadow-indigo-500/30">3</span>
                    Pilih Pembayaran
                </h4>
                <div class="p-4 bg-slate-900/50 border border-dashed border-slate-700 rounded-lg text-center text-sm text-slate-500">
                    Silakan pilih nominal terlebih dahulu
                </div>
            </div>
            
            <!-- Tombol Beli -->
            <button class="w-full py-4 bg-gradient-to-r from-indigo-600 to-purple-600 text-white font-bold rounded-xl shadow-lg shadow-indigo-500/25 hover:shadow-indigo-500/40 hover:scale-[1.01] transition-all active:scale-95">
                LANJUTKAN PEMBELIAN
            </button>
        </section>

    </main>

    <!-- FLOATING ACTION BUTTONS -->
    <div class="fixed bottom-6 right-4 flex flex-col gap-3 z-30">
        <button onclick="window.scrollTo({top: 0, behavior: 'smooth'})" class="w-12 h-12 bg-indigo-600 text-white rounded-full shadow-lg shadow-indigo-900/50 flex items-center justify-center hover:bg-indigo-500 transition-colors border border-indigo-400/30" title="Kembali ke Atas">
            <i class="fa-solid fa-chevron-up"></i>
        </button>
        <button class="w-12 h-12 bg-slate-800 text-indigo-400 border border-slate-700 rounded-full shadow-lg flex items-center justify-center hover:bg-slate-700 transition-colors" title="Hubungi CS">
            <i class="fa-solid fa-headset text-xl"></i>
        </button>
    </div>

    <!-- MODAL PEMILIHAN SERVER/LAYANAN -->
    <div id="service-modal" class="fixed inset-0 z-50 hidden">
        <div class="absolute inset-0 bg-black/80 backdrop-blur-sm" onclick="closeModal()"></div>
        
        <div class="absolute bottom-0 left-0 right-0 md:top-1/2 md:left-1/2 md:-translate-x-1/2 md:-translate-y-1/2 md:w-[500px] md:bottom-auto bg-slate-800 md:rounded-2xl rounded-t-2xl p-6 modal-enter max-h-[80vh] overflow-y-auto border border-slate-700 shadow-2xl">
            <div class="flex justify-between items-start mb-6">
                <div class="text-center w-full pr-8">
                    <h2 id="modal-title" class="text-2xl font-bold text-indigo-400 mb-1 uppercase" style="font-family: 'Orbitron', sans-serif;">GAME TITLE</h2>
                    <p id="modal-subtitle" class="text-sm text-slate-400">Pilih layanan yang kamu butuhkan</p>
                </div>
                <button onclick="closeModal()" class="w-8 h-8 bg-slate-700 text-slate-300 rounded-full flex items-center justify-center hover:bg-red-500/20 hover:text-red-400 transition-colors shrink-0 absolute top-4 right-4">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <div id="modal-options" class="space-y-3">
                <!-- Opsi di-render JS -->
            </div>
        </div>
    </div>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        // Data Dummy Produk
        const productsData = {
            mlbb: [
                { name: "5 Diamonds", price: "Rp 1.500", bonus: null },
                { name: "12 Diamonds", price: "Rp 3.500", bonus: "(11 + 1 Bonus)" },
                { name: "50 Diamonds", price: "Rp 14.000", bonus: null },
                { name: "70 Diamonds", price: "Rp 19.500", bonus: null },
                { name: "140 Diamonds", price: "Rp 38.000", bonus: "(130 + 10 Bonus)" },
                { name: "355 Diamonds", price: "Rp 95.000", bonus: "(330 + 25 Bonus)" },
            ],
            freefire: [
                { name: "5 Diamonds", price: "Rp 864", bonus: null },
                { name: "12 Diamonds", price: "Rp 1.831", bonus: null },
                { name: "70 Diamonds", price: "Rp 9.153", bonus: null },
                { name: "140 Diamonds", price: "Rp 18.306", bonus: null },
            ],
            hok: [
                { name: "16 Tokens", price: "Rp 3.241", bonus: null },
                { name: "80 Tokens", price: "Rp 16.206", bonus: null },
                { name: "830 Tokens", price: "Rp 163.389", bonus: "(800+30)" },
            ]
        };

        let currentGame = '';

        function openServiceModal(game) {
            currentGame = game;
            const modal = document.getElementById('service-modal');
            const title = document.getElementById('modal-title');
            const subtitle = document.getElementById('modal-subtitle');
            const optionsContainer = document.getElementById('modal-options');
            
            modal.classList.remove('hidden');
            optionsContainer.innerHTML = ''; 

            switch(game) {
                case 'mlbb':
                    title.innerText = 'MOBILE LEGENDS';
                    subtitle.innerText = 'Pilih server Mobile Legends';
                    optionsContainer.innerHTML = `
                        <button onclick="selectService('ml-id')" class="w-full flex items-center gap-4 p-4 bg-slate-900 border border-slate-700 rounded-xl hover:border-indigo-500 hover:bg-slate-800 transition-all text-left group">
                            <div class="w-14 h-14 rounded-lg bg-blue-500/20 flex items-center justify-center text-blue-400 text-xl"><i class="fa-solid fa-shield-cat"></i></div>
                            <div>
                                <h4 class="font-bold text-slate-200 group-hover:text-indigo-400">MOBILE LEGENDS ID</h4>
                                <p class="text-xs text-slate-500 mt-1">Server Indonesia</p>
                            </div>
                        </button>
                        <button onclick="selectService('ml-global')" class="w-full flex items-center gap-4 p-4 bg-slate-900 border border-slate-700 rounded-xl hover:border-indigo-500 hover:bg-slate-800 transition-all text-left group">
                            <div class="w-14 h-14 rounded-lg bg-blue-500/20 flex items-center justify-center text-blue-400 text-xl"><i class="fa-solid fa-globe"></i></div>
                            <div>
                                <h4 class="font-bold text-slate-200 group-hover:text-indigo-400">Mobile Legends Global</h4>
                                <p class="text-xs text-slate-500 mt-1">Server Luar Negeri</p>
                            </div>
                        </button>
                    `;
                    break;
                    
                case 'freefire':
                    title.innerText = 'FREE FIRE';
                    subtitle.innerText = 'Pilih versi Free Fire';
                    optionsContainer.innerHTML = `
                        <button onclick="selectService('ff-reg')" class="w-full flex items-center gap-4 p-4 bg-slate-900 border border-slate-700 rounded-xl hover:border-indigo-500 hover:bg-slate-800 transition-all text-left group">
                            <div class="w-14 h-14 rounded-lg bg-orange-500/20 flex items-center justify-center text-orange-400 text-xl"><i class="fa-solid fa-fire"></i></div>
                            <div>
                                <h4 class="font-bold text-slate-200 group-hover:text-indigo-400">FREE FIRE</h4>
                                <p class="text-xs text-slate-500 mt-1">Versi Reguler</p>
                            </div>
                        </button>
                        <button onclick="selectService('ff-max')" class="w-full flex items-center gap-4 p-4 bg-slate-900 border border-slate-700 rounded-xl hover:border-indigo-500 hover:bg-slate-800 transition-all text-left group">
                            <div class="w-14 h-14 rounded-lg bg-red-500/20 flex items-center justify-center text-red-400 text-xl"><i class="fa-solid fa-bolt"></i></div>
                            <div>
                                <h4 class="font-bold text-slate-200 group-hover:text-indigo-400">FREE FIRE MAX</h4>
                                <p class="text-xs text-slate-500 mt-1">Versi HD / Max</p>
                            </div>
                        </button>
                    `;
                    break;

                case 'roblox':
                    title.innerText = 'ROBLOX';
                    subtitle.innerText = 'Pilih metode top up Roblox';
                    optionsContainer.innerHTML = `
                        <button onclick="selectService('roblox-gc')" class="w-full flex items-center gap-4 p-4 bg-slate-900 border border-slate-700 rounded-xl hover:border-indigo-500 hover:bg-slate-800 transition-all text-left group">
                            <div class="w-14 h-14 rounded-lg bg-gray-500/20 flex items-center justify-center text-gray-300 text-xl"><i class="fa-solid fa-ticket"></i></div>
                            <div>
                                <h4 class="font-bold text-slate-200 group-hover:text-indigo-400">ROBLOX GIFTCARD</h4>
                                <p class="text-xs text-slate-500 mt-1">Kode Voucher Resmi</p>
                            </div>
                        </button>
                        <button onclick="selectService('roblox-login')" class="w-full flex items-center gap-4 p-4 bg-slate-900 border border-slate-700 rounded-xl hover:border-indigo-500 hover:bg-slate-800 transition-all text-left group">
                            <div class="w-14 h-14 rounded-lg bg-gray-500/20 flex items-center justify-center text-gray-300 text-xl"><i class="fa-solid fa-key"></i></div>
                            <div>
                                <h4 class="font-bold text-slate-200 group-hover:text-indigo-400">ROBLOX VIA LOGIN</h4>
                                <p class="text-xs text-slate-500 mt-1">Top up langsung ke akun</p>
                            </div>
                        </button>
                    `;
                    break;

                default:
                    selectService(game);
                    return;
            }
        }

        function closeModal() {
            document.getElementById('service-modal').classList.add('hidden');
        }

        function selectService(serviceType) {
            closeModal();
            const section = document.getElementById('topup-section');
            const title = document.getElementById('selected-game-title');
            const grid = document.getElementById('product-grid');
            
            section.classList.remove('hidden');
            
            const gameNames = {
                'mlbb': 'Mobile Legends', 'ml-id': 'Mobile Legends ID', 'ml-global': 'ML Global',
                'freefire': 'Free Fire', 'ff-reg': 'Free Fire', 'ff-max': 'Free Fire Max',
                'roblox': 'Roblox', 'roblox-gc': 'Roblox Giftcard', 'roblox-login': 'Roblox Login',
                'pubg': 'PUBG Mobile', 'genshin': 'Genshin Impact', 'valorant': 'Valorant',
                'hok': 'Honor of Kings', 'tiktok': 'TikTok Services'
            };
            title.innerText = `TOP UP ${gameNames[serviceType] || serviceType.toUpperCase()}`;
            
            const products = productsData[currentGame] || productsData['mlbb'];
            
            grid.innerHTML = products.map((prod) => `
                <div onclick="selectProduct(this)" class="product-card cursor-pointer p-4 rounded-xl relative group">
                    <div class="flex justify-between items-start mb-2">
                        <h4 class="font-bold text-slate-200 text-sm leading-tight">${prod.name}</h4>
                        <i class="fa-regular fa-circle-check text-slate-600 group-hover:text-indigo-400 check-icon transition-colors"></i>
                    </div>
                    ${prod.bonus ? `<p class="text-[10px] text-slate-500 mb-2">${prod.bonus}</p>` : '<div class="mb-2"></div>'}
                    <p class="text-indigo-400 font-bold text-sm">${prod.price}</p>
                </div>
            `).join('');

            setTimeout(() => {
                section.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }, 100);
        }

        function selectProduct(element) {
            document.querySelectorAll('.product-card').forEach(card => {
                card.classList.remove('active');
                card.querySelector('.check-icon').classList.remove('fa-solid', 'text-indigo-400');
                card.querySelector('.check-icon').classList.add('fa-regular', 'text-slate-600');
            });
            
            element.classList.add('active');
            element.querySelector('.check-icon').classList.remove('fa-regular', 'text-slate-600');
            element.querySelector('.check-icon').classList.add('fa-solid', 'text-indigo-400');
        }

        function resetSelection() {
            document.getElementById('topup-section').classList.add('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    </script>
</body>
</html>
